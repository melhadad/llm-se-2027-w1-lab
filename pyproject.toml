[project]
name = "llm-se-2027-w1-lab"
version = "0.1.0"
description = "W1 lab: issue triage with an LLM component"
requires-python = ">=3.13"
dependencies = [
    "dspy>=2.6",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pyright>=1.1.390",
]

# Installing the project (editable) is what makes `python -m triage.cli` and
# `python -m triage_by_agent.cli` work from a plain terminal on every platform.
# Without it you need PYTHONPATH=src, which is POSIX-only and breaks in
# PowerShell.
#
# `sources = ["src"]` maps the src/ layout onto the package root, and
# `only-include` keeps everything else out of the wheel. Packages that appear
# under src/ AFTER the install -- triage_by_agent arrives at 0:45 -- are picked
# up without re-syncing.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# src layout: this project is not installed into the environment, so tests
# import `triage` from the source tree directly.
pythonpath = ["src"]

[tool.pyright]
# Your code, and only your code. `uv run pyright` is a constraint the lab puts
# on what you build, so it has to be a check you can actually pass: tools/ is
# course scaffolding you did not write and are not graded on, and it does not
# currently type-clean.
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

# The LLM boundary is the one place in this repository where types stop.
# DSPy returns dynamically-shaped prediction objects that no type checker can
# describe. That is not a defect in DSPy - it is what calling a stochastic
# system looks like from inside a typed program.
#
# We do not silence this globally. We name each seam, one FILE at a time.
# Everything on the far side of it is your responsibility to validate at
# runtime, because the compiler has stopped helping you.
#
# Do NOT "simplify" these to a directory. Pyright picks the first execution
# environment whose root is a prefix of the file being checked, so
# root = "src/triage" risks also matching src/triage_by_agent/... and quietly
# relaxing code you did not write. Files only, most specific first.

# Exercise A - your seam. If you call DSPy from somewhere other than
# extract.py, point this at that file instead. Do not widen it to a directory.
[[tool.pyright.executionEnvironments]]
root = "src/triage/extract.py"
reportUnknownMemberType = "warning"
reportUnknownVariableType = "warning"
reportUnknownArgumentType = "warning"

# Exercise B - the released package's seam. It arrives at 0:45; until then this
# entry matches nothing, which is harmless (pyright does not require the root
# to exist).
[[tool.pyright.executionEnvironments]]
root = "src/triage_by_agent/extract.py"
reportUnknownMemberType = "warning"
reportUnknownVariableType = "warning"
reportUnknownArgumentType = "warning"
